name: SOR
version: "0.1.0"
license: "GPL-2.0-or-later"
date: 2026-11-25
description: |
    Rocco's nu(G), Sidki's chi(G) and related groups via free products with embeddings

authors:
    - name: Ricardo Nunes de Oliveira
      url: mailto:ricardo@ufg.br

maintainers:
    - name: Ricardo Nunes de Oliveira
      url: mailto:ricardo@ufg.br

GAP: ">= 4.13"

needed-pkgs:
    - name: "polycyclic"
      version: ">= 2.16"
      url: "https://gap-packages.github.io/polycyclic/"

suggested-pkgs:
    - name: "nq"
      version: ">= 2.5"
      url: "https://gap-packages.github.io/nq/"

www: https://deoliveirarn.github.io/SOR/
readme: README.md
packageinfo: https://deoliveirarn.github.io/SOR/PackageInfo.g

downloads:
    - name: .tar.gz
      url: https://github.com/deoliveirarn/SOR/releases/download/v0.1.0/SOR-0.1.0.tar.gz

abstract: |
    The <span class="pkgname">SOR</span> package computes Rocco's group &nu;(G), its variant &nu;<sup>q</sup>(G), Sidki's weak commutativity group &chi;(G), its n-copy version and its variants defined by bijections, always as a quotient of a free product of copies of G that keeps the embeddings of the copies of G and the related subgroups.

doc-html: doc/chap0_mj.html
doc-pdf: doc/manual.pdf
keywords: |
    weak commutativity, non-abelian tensor square, Rocco group, Sidki group, free product.
